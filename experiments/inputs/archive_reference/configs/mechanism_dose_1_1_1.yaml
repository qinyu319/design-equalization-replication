design:
  name: mechanism_dose_1_1_1
  design_class: calibrated_dose_span
  dose_span_ratio: "1:1:1"
  message_strength_scheme: calibrated
  paired_seed_namespace: strict_dose_span_v1
  topologies: [BA, ER, WS, SBM]
  message_conditions:
    high_quality_ai: 0.18
    low_quality_ai: 0.06
    labeled_ai: 0.18
    human_equivalent: 0.14
  inoculation_strategies: [none, random, hub]
  seeding_regimes: [single_shot, burst, continuous]
  replications: 30
simulation:
  n_agents: 1000
  n_steps: 50
  seed_fraction: 0.05
  seeding_total_fractions: {single_shot: 0.05, burst: 0.05, continuous: 0.05}
  dose_matched: false
  inoculation_budget_fraction: 0.05
  sharing_probability: 0.30
  second_hand_attenuation: 0.70
  disclosure_lambda: 0.70
  inoculation_kappa: 0.20
  noise_scale: 0.30
  target_position: 0.60
  activation_threshold: 0.01
output:
  dir: outputs/processed/mechanism_dose_1_1_1
  seed_manifest: seed_manifest.csv
  version: mechanism-audit-v1.0
